name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APKs
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Name the APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk out/BarqDownload-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk out/BarqDownload-armeabi-v7a.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: BarqDownload-APK
          path: out/*.apk

      - name: Publish the APKs as a release (direct download links)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Barq Download (latest)
          prerelease: false
          make_latest: true
          files: out/*.apk

      - name: Keep the error log (only when the build fails)
        if: failure()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          touch build.log
          { grep -E "^e: |^w: .*error|error:|FAILURE|What went wrong|Could not|> Task .*FAILED|Execution failed" build.log | head -400; echo "-----"; tail -150 build.log; } > errors.txt || true
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add -f errors.txt build.log
          git commit -m "build log ${GITHUB_SHA}"
          git push -f origin ci-log
